# Test configuration — embedded H2 database (no credentials needed)
spring.datasource.url=jdbc:h2:mem:eventease;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT configuration (test values only)
jwt.secret=test-secret-key-for-testing-purposes-only-min-256-bits
jwt.expiration=86400000

# Server
server.port=8080

# CORS (Angular dev server)
cors.allowed.origins=http://localhost:4200
