# ==========================================
# EventEase — Example configuration (SAFE TEMPLATE)
# ==========================================
# Copy this file to application.properties and fill in your own credentials.
# application.properties is gitignored — never commit real credentials.

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/eventease?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password_here}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL logging
spring.sql.init.platform=mysql

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT configuration
# Generate a strong random value (at least 256 bits) for production.
# Example: openssl rand -base64 32
jwt.secret=${JWT_SECRET:replace_with_a_long_random_secret_at_least_32_chars}
jwt.expiration=86400000

# Server
server.port=8080
server.servlet.context-path=

# CORS (Angular dev server). Wildcards let the app run on any local port,
# e.g. http://localhost:4201 if 4200 is busy.
cors.allowed.origins=http://localhost:*,http://127.0.0.1:*
